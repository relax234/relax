name: Build Windows EXE & Auto-Updater

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web dependencies & build bundle
        shell: pwsh
        run: |
          npm install
          npm run build

      - name: Install Electron dependencies
        shell: pwsh
        working-directory: electron
        run: npm install

      - name: Configure GitHub auto-updater repository metadata
        shell: pwsh
        run: |
          $repoParts = "${{ github.repository }}".Split("/")
          $cfg = Get-Content "electron/electron-builder.json" -Raw | ConvertFrom-Json
          $cfg.publish = @(@{
            provider = "github"
            owner = $repoParts[0]
            repo = $repoParts[1]
          })
          $cfg | ConvertTo-Json -Depth 6 | Set-Content "electron/electron-builder.json" -Encoding UTF8

      - name: Build Windows Installer (.exe) & Portable (.exe)
        working-directory: electron
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node prepare-dist.mjs
          $ref = "${{ github.ref }}"
          if ($ref -like "refs/tags/v*") {
            Write-Host "Publishing release build..."
            npx electron-builder --win --x64 --config electron-builder.json --publish always
          } else {
            Write-Host "Local build (no publish)..."
            npx electron-builder --win --x64 --config electron-builder.json --publish never
          }

      - name: Upload built EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OptiCore-Windows-EXE
          path: |
            release/*.exe
            release/latest.yml
